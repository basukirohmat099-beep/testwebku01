<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ARCHIVE-TOOLS</title>
<link rel="stylesheet" href="css/style.css">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>
<body>
  <div class="app">
    <!-- Header -->
    <header class="header">
      <div class="header-left">
        <div class="logo-icon"><i class="fas fa-archive"></i></div>
        <span class="logo-text">ARCHIVE-TOOLS</span>
      </div>
      <div class="header-right">
        <span class="display-mode">MODE <strong>Pro</strong></span>
        <button class="icon-btn" aria-label="Menu"><i class="fas fa-ellipsis-v"></i></button>
      </div>
    </header>

    <!-- Hero Banner -->
    <section class="hero">
      <div class="hero-bg"></div>
      <div class="hero-content">
        <div class="live-badge"><span class="dot"></span> SYSTEM ONLINE</div>
        <div class="hero-logo">
          <div class="n-logo">A</div>
          <div>
            <h1>ARCHIVE-TOOLS</h1>
            <p class="dev">Precision Vector Studio</p>
          </div>
        </div>
      </div>
    </section>

    <!-- Session Info -->
    <section class="session-matrix">
      <div class="info-card">
        <i class="fas fa-fingerprint"></i>
        <div>
          <span class="label">SESSION</span>
          <span class="value">Archive Core</span>
        </div>
      </div>
      <div class="info-card">
        <i class="fas fa-globe"></i>
        <div>
          <span class="label">REGION</span>
          <span class="value"><img src="https://flagcdn.com/w20/id.png" alt="ID"> Indonesia</span>
        </div>
      </div>
      <div class="info-card">
        <i class="fas fa-mobile-alt"></i>
        <div>
          <span class="label">DEVICE</span>
          <span class="value">Android</span>
        </div>
      </div>
      <div class="info-card">
        <i class="fas fa-chrome"></i>
        <div>
          <span class="label">BROWSER</span>
          <span class="value">Chrome</span>
        </div>
      </div>
      <div class="info-card">
        <i class="fas fa-signal"></i>
        <div>
          <span class="label">STATUS</span>
          <span class="value online"><span class="status-dot"></span> Online</span>
        </div>
      </div>
      <div class="info-card">
        <i class="fas fa-battery-three-quarters"></i>
        <div>
          <span class="label">BATTERY</span>
          <span class="value">36%</span>
        </div>
      </div>
    </section>

    <!-- Category Tabs -->
    <nav class="tabs">
      <button class="tab active" data-cat="all"><i class="fas fa-th"></i> All</button>
      <button class="tab" data-cat="downloader"><i class="fas fa-download"></i> Downloader</button>
      <button class="tab" data-cat="maker"><i class="fas fa-magic"></i> Maker</button>
      <button class="tab" data-cat="tools"><i class="fas fa-tools"></i> Tools</button>
    </nav>

    <!-- Tools Section -->
    <section class="tools-section">
      <div class="section-header">
        <h2><i class="fas fa-layer-group"></i> All Tools</h2>
        <span class="catalog">catalog <strong id="tool-count">12</strong></span>
      </div>
      <div class="tools-grid" id="tools-grid"></div>
    </section>
  </div>

  <div id="tool-page" class="tool-page hidden"></div>
  <script src="js/app.js"></script>
</body>
</html>
